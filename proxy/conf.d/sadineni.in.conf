server {
    listen 80;
    server_name sadineni.in www.sadineni.in;

    # Let's Encrypt HTTP-01 challenge — certbot (see docker-compose.yml)
    # writes files here, served straight from the shared webroot volume.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name sadineni.in www.sadineni.in;

    ssl_certificate     /etc/letsencrypt/live/sadineni.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sadineni.in/privkey.pem;

    location / {
        # "myprofile" resolves via Docker's internal DNS to the app
        # container, since both are on the same compose-owned network.
        proxy_pass http://myprofile:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
